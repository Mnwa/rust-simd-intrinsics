[package]
name = "rust-simd-skill-examples"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
wide-example = ["dep:wide"]
fearless-example = ["dep:fearless_simd"]
portable-simd-example = []

[dependencies]
wide = { version = "=1.6.1", optional = true }
fearless_simd = { version = "=0.7.0", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
